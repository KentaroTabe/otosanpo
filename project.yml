name: OtoSanpo
options:
  bundleIdPrefix: dev.otosanpo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM は個人固有のため xcconfig 側に置く(この生成物は毎回作り直されるため、
# Xcode の GUI で設定しても setup.sh のたびに消える)。実体は Support/Signing.xcconfig。
configFiles:
  Debug: Support/Signing.xcconfig
  Release: Support/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    # TARGETED_DEVICE_FAMILY はここに書いても効かない(ターゲット側の既定値が勝つ)。
    # 実体は OtoSanpo ターゲットの settings にある
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM はここに書かない(ここの値が xcconfig を上書きしてしまうため)

targets:
  OtoSanpo:
    type: application
    platform: iOS
    sources:
      # Sources 全体ではなく個別に並べる。Sources/Replay は macOS のコマンドラインツール
      # (トップレベルコードを持つ)なので、アプリに混ぜると @main と衝突する
      - path: Sources/App
      - path: Sources/Core
      - path: Sources/Services
      - path: config/parameters.json
        buildPhase: resources
      # アイコン。**App Store Connect はアイコンの無いビルドを受け付けない**ので、
      # TestFlight へ上げるために要る。中身は仮(scripts/make_icon.py で作り直せる)
      - path: Support/Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # **ここ(ターゲット)に書く。** プロジェクト階層に書いても、XcodeGen が
        # ターゲット階層へ入れる既定値(1,2)に上書きされる。
        # iPad が混ざると App Store Connect の検証で弾かれる
        # (iPad のマルチタスクに対応するには 4 方向すべての向きが要る)。
        # このアプリは iPhone 専用・縦向き固定なので、iPad を外すのが正しい
        TARGETED_DEVICE_FAMILY: "1"
        # 表示上の版。**外部テストの Beta App Review はこの値が変わるたびに要る**ので、
        # 中身の修正だけなら据え置き、ビルド番号(下)だけを上げる
        MARKETING_VERSION: "1.0"
        # scripts/archive.sh が配信のたびに日時で上書きする。ここの値は既定にすぎない
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Support/Info.plist
      properties:
        # **ビルド設定を参照する形で書く。** 数値を直書きすると archive.sh が
        # 渡すビルド番号が効かず、毎回同じ番号になる。
        # App Store Connect は同じ番号を 2 度受け付けないので、2 回目の配信で弾かれる
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        # **位置の履歴は送らない。** 地図の取得で外へ出るのは「取得する区画の番号」
        # (約 5 km 角)だけで、これは利用者がボタンを押した時のみ(docs/12)
        NSLocationWhenInUseUsageDescription: >-
          散歩中の現在地から、寄り道の提案と帰路の方向案内を行うために使用します。
          位置の履歴は端末内にのみ保存され、外部に送信されません。
          地図を取得する時だけ、その区画(約 5 km 角)の番号を配信元へ送ります。
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          ポケットに入れたままでも案内を続けるため、バックグラウンドでも位置情報を使用します。
          履歴は端末内にのみ保存されます。
        NSMotionUsageDescription: >-
          うなずき・首振りの応答を検出するため、AirPods のモーションデータを使用します。
        ITSAppUsesNonExemptEncryption: false
        # フィールドログ(Documents)を Finder / Files アプリから取り出せるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  OtoSanpoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OtoSanpo

  # 記録したフィールドログを再生して Core を検証する開発用ツール(macOS)。
  # 実機テストの回数を減らすための土台。docs/05「検証の方針」
  Replay:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Core
      - path: Sources/Replay
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: otosanpo-replay

  # osmium が出した GeoJSON を端末に置く WalkMap 形式へ変換する開発用ツール(macOS)。
  # 形式の定義をアプリと共有するため Swift で書く。docs/04「OSM データの持ち方」
  MapBuild:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Core
      - path: Sources/MapBuild
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: otosanpo-mapbuild

  # 紹介用の音を書き出す開発ツール(macOS)。
  # アプリと同じ Core のコードで鳴らすので、紹介した音と実物が食い違わない
  Demo:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Core
      - path: Sources/Demo
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: otosanpo-demo

schemes:
  Demo:
    build:
      targets:
        Demo: all
    run:
      config: Debug

  MapBuild:
    build:
      targets:
        MapBuild: all
    run:
      config: Debug

  Replay:
    build:
      targets:
        Replay: all
    run:
      config: Debug

  OtoSanpo:
    build:
      targets:
        OtoSanpo: all
        OtoSanpoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OtoSanpoTests
