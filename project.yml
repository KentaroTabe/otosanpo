name: OtoSanpo
options:
  bundleIdPrefix: dev.otosanpo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM は個人固有のため xcconfig 側に置く(この生成物は毎回作り直されるため、
# Xcode の GUI で設定しても setup.sh のたびに消える)。実体は Support/Signing.xcconfig。
configFiles:
  Debug: Support/Signing.xcconfig
  Release: Support/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM はここに書かない(ここの値が xcconfig を上書きしてしまうため)

targets:
  OtoSanpo:
    type: application
    platform: iOS
    sources:
      # Sources 全体ではなく個別に並べる。Sources/Replay は macOS のコマンドラインツール
      # (トップレベルコードを持つ)なので、アプリに混ぜると @main と衝突する
      - path: Sources/App
      - path: Sources/Core
      - path: Sources/Services
      - path: config/parameters.json
        buildPhase: resources
      # アイコン。**App Store Connect はアイコンの無いビルドを受け付けない**ので、
      # TestFlight へ上げるために要る。中身は仮(scripts/make_icon.py で作り直せる)
      - path: Support/Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: >-
          散歩中の現在地から、寄り道の提案と帰路の方向案内を行うために使用します。
          位置の履歴は端末内にのみ保存され、外部に送信されません。
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          ポケットに入れたままでも案内を続けるため、バックグラウンドでも位置情報を使用します。
          履歴は端末内にのみ保存されます。
        NSMotionUsageDescription: >-
          うなずき・首振りの応答を検出するため、AirPods のモーションデータを使用します。
        ITSAppUsesNonExemptEncryption: false
        # フィールドログ(Documents)を Finder / Files アプリから取り出せるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  OtoSanpoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OtoSanpo

  # 記録したフィールドログを再生して Core を検証する開発用ツール(macOS)。
  # 実機テストの回数を減らすための土台。docs/05「検証の方針」
  Replay:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Core
      - path: Sources/Replay
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: otosanpo-replay

  # osmium が出した GeoJSON を端末に置く WalkMap 形式へ変換する開発用ツール(macOS)。
  # 形式の定義をアプリと共有するため Swift で書く。docs/04「OSM データの持ち方」
  MapBuild:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Core
      - path: Sources/MapBuild
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: otosanpo-mapbuild

  # 紹介用の音を書き出す開発ツール(macOS)。
  # アプリと同じ Core のコードで鳴らすので、紹介した音と実物が食い違わない
  Demo:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Core
      - path: Sources/Demo
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: otosanpo-demo

schemes:
  Demo:
    build:
      targets:
        Demo: all
    run:
      config: Debug

  MapBuild:
    build:
      targets:
        MapBuild: all
    run:
      config: Debug

  Replay:
    build:
      targets:
        Replay: all
    run:
      config: Debug

  OtoSanpo:
    build:
      targets:
        OtoSanpo: all
        OtoSanpoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OtoSanpoTests
